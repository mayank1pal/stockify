<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMan — Holdings</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><span class="brand-mark">S</span> StockMan</a>
    <ul class="navbar-nav" id="navMenu">
      <li><a href="dashboard.html"><span class="nav-icon">&#9678;</span> Dashboard</a></li>
      <li><a href="holdings.html" class="active"><span class="nav-icon">&#9636;</span> Holdings</a></li>
      <li><a href="analysis.html"><span class="nav-icon">&#9672;</span> Analysis</a></li>
      <li><a href="copilot.html"><span class="nav-icon">&#11041;</span> Copilot</a></li>
      <li><a href="strategy.html"><span class="nav-icon">&#9670;</span> Strategy</a></li>
    </ul>
    <div class="navbar-right">
      <div class="navbar-user"><span id="userName"></span><div class="avatar" id="userAvatar"></div></div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
  </nav>

  <div class="main-content">
    <div class="page-header animate-in">
      <h1>Holdings</h1>
      <p class="subtitle">Complete view of your stock portfolio</p>
    </div>

    <div class="stats-grid" id="summaryStats"></div>

    <div class="flex items-center justify-between mb-md animate-in animate-in-delay-1">
      <div class="flex gap-sm">
        <button class="btn btn-secondary btn-sm" id="sortPnlBtn" onclick="sortBy('pnl')">Sort by P&amp;L</button>
        <button class="btn btn-ghost btn-sm" id="sortValueBtn" onclick="sortBy('value')">Sort by Value</button>
      </div>
    </div>

    <div class="card animate-in animate-in-delay-2">
      <table class="data-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th class="col-number">Qty</th>
            <th class="col-number">Avg Price</th>
            <th class="col-number">LTP</th>
            <th class="col-number">Invested</th>
            <th class="col-number">Current</th>
            <th class="col-number">P&amp;L</th>
            <th class="col-number">Change %</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="holdingsBody"></tbody>
      </table>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script src="scripts/app.js"></script>
  <script>
    let holdings = [];
    let currentSort = 'pnl';

    // Use formatCurrency/formatPercentage from api.js if available, otherwise define them
    if (typeof formatCurrency === 'undefined') {
      window.formatCurrency = function(value) {
        return '\u20B9' + parseFloat(value).toLocaleString('en-IN', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      };
    }
    if (typeof formatPercentage === 'undefined') {
      window.formatPercentage = function(value) {
        const num = parseFloat(value);
        const sign = num >= 0 ? '+' : '';
        return sign + num.toFixed(2) + '%';
      };
    }

    function toggleNav() {
      document.getElementById('navMenu').classList.toggle('open');
    }

    async function logout() {
      await API.logout();
      window.location.href = '/';
    }

    function renderSummary() {
      const total = holdings.length;
      const profitable = holdings.filter(function(h) { return parseFloat(h.pnl) > 0; }).length;
      const inLoss = holdings.filter(function(h) { return parseFloat(h.pnl) < 0; }).length;

      var container = document.getElementById('summaryStats');
      // Clear existing content
      container.textContent = '';

      // Total Holdings card
      var card1 = document.createElement('div');
      card1.className = 'stat-card';
      var label1 = document.createElement('span');
      label1.className = 'stat-label';
      label1.textContent = 'Total Holdings';
      var value1 = document.createElement('span');
      value1.className = 'stat-value';
      value1.textContent = total;
      card1.appendChild(label1);
      card1.appendChild(value1);

      // Profitable card
      var card2 = document.createElement('div');
      card2.className = 'stat-card';
      var label2 = document.createElement('span');
      label2.className = 'stat-label';
      label2.textContent = 'Profitable';
      var value2 = document.createElement('span');
      value2.className = 'stat-value positive';
      value2.textContent = profitable;
      card2.appendChild(label2);
      card2.appendChild(value2);

      // In Loss card
      var card3 = document.createElement('div');
      card3.className = 'stat-card';
      var label3 = document.createElement('span');
      label3.className = 'stat-label';
      label3.textContent = 'In Loss';
      var value3 = document.createElement('span');
      value3.className = 'stat-value negative';
      value3.textContent = inLoss;
      card3.appendChild(label3);
      card3.appendChild(value3);

      container.appendChild(card1);
      container.appendChild(card2);
      container.appendChild(card3);
    }

    function createCell(text, className) {
      var td = document.createElement('td');
      if (className) td.className = className;
      td.textContent = text;
      return td;
    }

    function renderTable() {
      var tbody = document.getElementById('holdingsBody');
      tbody.textContent = '';

      if (!holdings || holdings.length === 0) {
        var emptyRow = document.createElement('tr');
        var emptyCell = document.createElement('td');
        emptyCell.setAttribute('colspan', '9');
        emptyCell.style.textAlign = 'center';
        emptyCell.style.padding = '2rem';
        emptyCell.textContent = 'No holdings found.';
        emptyRow.appendChild(emptyCell);
        tbody.appendChild(emptyRow);
        return;
      }

      holdings.forEach(function(h) {
        var pnl = parseFloat(h.pnl);
        var pnlPct = parseFloat(h.pnlPercentage);
        var pnlClass = pnl >= 0 ? 'positive' : 'negative';
        var invested = h.investedValue || (parseFloat(h.averagePrice) * parseInt(h.quantity));
        var current = h.currentValue || (parseFloat(h.lastPrice) * parseInt(h.quantity));
        var symbol = h.tradingSymbol;

        var tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function(event) {
          // Don't navigate if the click was on the button
          if (event.target.tagName === 'BUTTON') return;
          window.location.href = 'analysis.html?symbol=' + encodeURIComponent(symbol);
        });

        tr.appendChild(createCell(symbol, 'col-symbol'));
        tr.appendChild(createCell(h.quantity, 'col-number'));
        tr.appendChild(createCell(formatCurrency(h.averagePrice), 'col-number'));
        tr.appendChild(createCell(formatCurrency(h.lastPrice), 'col-number'));
        tr.appendChild(createCell(formatCurrency(invested), 'col-number'));
        tr.appendChild(createCell(formatCurrency(current), 'col-number'));

        var pnlCell = createCell(formatCurrency(pnl), 'col-number ' + pnlClass);
        tr.appendChild(pnlCell);

        var pctCell = createCell(formatPercentage(pnlPct), 'col-number ' + pnlClass);
        tr.appendChild(pctCell);

        var actionTd = document.createElement('td');
        var btn = document.createElement('button');
        btn.className = 'btn btn-ghost btn-sm';
        btn.textContent = 'Analyze';
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          window.location.href = 'analysis.html?symbol=' + encodeURIComponent(symbol);
        });
        actionTd.appendChild(btn);
        tr.appendChild(actionTd);

        tbody.appendChild(tr);
      });
    }

    function sortBy(field) {
      currentSort = field;
      if (field === 'pnl') {
        holdings.sort(function(a, b) { return parseFloat(b.pnl) - parseFloat(a.pnl); });
      } else if (field === 'value') {
        holdings.sort(function(a, b) { return parseFloat(b.currentValue) - parseFloat(a.currentValue); });
      }

      var pnlBtn = document.getElementById('sortPnlBtn');
      var valBtn = document.getElementById('sortValueBtn');
      if (field === 'pnl') {
        pnlBtn.className = 'btn btn-secondary btn-sm';
        valBtn.className = 'btn btn-ghost btn-sm';
      } else {
        pnlBtn.className = 'btn btn-ghost btn-sm';
        valBtn.className = 'btn btn-secondary btn-sm';
      }

      renderTable();
    }

    document.addEventListener('DOMContentLoaded', async function() {
      try {
        var authStatus = await API.getAuthStatus();
        if (!authStatus.authenticated) {
          window.location.href = '/';
          return;
        }

        var name = authStatus.userName || 'Demo User';
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();

        var data = await API.getHoldings();
        holdings = Array.isArray(data) ? data : (data.holdings || []);

        // Default sort by P&L descending
        holdings.sort(function(a, b) { return parseFloat(b.pnl) - parseFloat(a.pnl); });

        renderSummary();
        renderTable();
      } catch (err) {
        console.error('Failed to load holdings:', err);
        var tbody = document.getElementById('holdingsBody');
        tbody.textContent = '';
        var errorRow = document.createElement('tr');
        var errorCell = document.createElement('td');
        errorCell.setAttribute('colspan', '9');
        errorCell.style.textAlign = 'center';
        errorCell.style.padding = '2rem';
        errorCell.textContent = 'Failed to load holdings. Please try again.';
        errorRow.appendChild(errorCell);
        tbody.appendChild(errorRow);
      }
    });
  </script>
</body>
</html>
