<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMan — AI Analysis</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand"><span class="brand-mark">S</span> StockMan</a>
    <ul class="navbar-nav" id="navMenu">
      <li><a href="dashboard.html"><span class="nav-icon">◎</span> Dashboard</a></li>
      <li><a href="holdings.html"><span class="nav-icon">▤</span> Holdings</a></li>
      <li><a href="analysis.html" class="active"><span class="nav-icon">◈</span> Analysis</a></li>
      <li><a href="copilot.html"><span class="nav-icon">⬡</span> Copilot</a></li>
      <li><a href="strategy.html"><span class="nav-icon">◆</span> Strategy</a></li>
      <li><a href="scanner.html"><span class="nav-icon">◉</span> Scanner</a></li>
    </ul>
    <div class="navbar-right">
      <div class="navbar-user"><span id="userName"></span><div class="avatar" id="userAvatar"></div></div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
  </nav>

  <div class="main-content">
    <div class="page-header animate-in">
      <h1>AI Analysis</h1>
      <p class="subtitle">Converse with specialized analyst agents</p>
    </div>

    <div class="agent-grid mb-lg animate-in animate-in-delay-1" id="agentGrid"></div>

    <div class="flex items-center gap-md mb-lg animate-in animate-in-delay-2">
      <div class="form-group" style="min-width: 220px;">
        <label class="form-label">Stock</label>
        <select class="form-select" id="stockSelect">
          <option value="">General Question</option>
        </select>
      </div>
    </div>

    <div class="card animate-in animate-in-delay-3">
      <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
          <span class="empty-icon">◈</span>
          <p class="empty-text">Select an agent and ask a question about any stock or market topic</p>
        </div>
      </div>

      <div class="chips mt-md" id="suggestions"></div>

      <div class="chat-input-area">
        <textarea class="form-textarea" id="chatInput" placeholder="Ask your question..." rows="1"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
        <button class="btn btn-ghost" onclick="clearChat()">Clear</button>
      </div>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script src="scripts/app.js"></script>
  <script>
    let selectedAgent = null;
    let conversationHistory = [];
    let agents = [];

    // ── Auth ──────────────────────────────────────────────
    async function checkAuth() {
      try {
        const status = await API.getAuthStatus();
        if (!status.authenticated) {
          window.location.href = '/index.html';
          return;
        }
        const name = status.userName || 'Demo User';
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name[0].toUpperCase();
      } catch (e) {
        window.location.href = '/index.html';
      }
    }

    // ── Nav helpers ──────────────────────────────────────
    function toggleNav() {
      document.getElementById('navMenu').classList.toggle('open');
    }

    async function logout() {
      await API.logout();
      window.location.href = '/';
    }

    // ── Load agents ──────────────────────────────────────
    async function loadAgents() {
      try {
        agents = await API.getAgents();
        renderAgents();

        const generalAgent = agents.find(function(a) { return a.type === 'GENERAL'; });
        if (generalAgent) {
          selectAgent(generalAgent.type);
        }
      } catch (error) {
        console.error('Error loading agents:', error);
      }
    }

    function renderAgents() {
      var grid = document.getElementById('agentGrid');
      var html = '';
      for (var i = 0; i < agents.length; i++) {
        var agent = agents[i];
        var isSelected = selectedAgent === agent.type;
        var tags = '';
        var areas = agent.focusAreas || [];
        for (var j = 0; j < Math.min(areas.length, 2); j++) {
          tags += '<span class="agent-tag">' + escapeHtml(areas[j]) + '</span>';
        }
        html += '<div class="agent-card' + (isSelected ? ' selected' : '') + '"'
              + ' onclick="selectAgent(\'' + escapeHtml(agent.type) + '\')">'
              + '<span class="agent-icon">' + escapeHtml(agent.icon) + '</span>'
              + '<div class="agent-name">' + escapeHtml(agent.name) + '</div>'
              + '<div class="agent-desc">' + escapeHtml(agent.description) + '</div>'
              + '<div class="agent-tags">' + tags + '</div>'
              + '</div>';
      }
      grid.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ── Select agent ─────────────────────────────────────
    function selectAgent(type) {
      selectedAgent = type;
      renderAgents();
      updateSuggestions();
    }

    // ── Suggestion chips ─────────────────────────────────
    var suggestionMap = {
      'FUNDAMENTAL': [
        'What are the key financial ratios?',
        'Is this stock undervalued?',
        'Analyze the balance sheet'
      ],
      'TECHNICAL': [
        'What do the moving averages indicate?',
        'Identify support and resistance',
        'RSI analysis'
      ],
      'QUANTITATIVE': [
        'Calculate risk-adjusted returns',
        'Monte Carlo simulation',
        'Portfolio correlation'
      ],
      'SENTIMENT': [
        "What's the market sentiment?",
        'Recent news impact',
        'Social media trends'
      ],
      'GENERAL': [
        'Give me an overview',
        'Investment thesis',
        'Risks and opportunities'
      ]
    };

    function updateSuggestions() {
      var container = document.getElementById('suggestions');
      var items = suggestionMap[selectedAgent] || suggestionMap['GENERAL'];
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var btn = document.createElement('button');
        btn.textContent = items[i];
        // Build safely but we need onclick — use data approach
        html += '<button class="chip" data-suggestion="' + escapeHtml(items[i]) + '">' + escapeHtml(items[i]) + '</button>';
      }
      container.innerHTML = html;

      // Attach click handlers
      var chips = container.querySelectorAll('.chip');
      chips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.getElementById('chatInput').value = this.getAttribute('data-suggestion');
          sendMessage();
        });
      });
    }

    // ── Load holdings ────────────────────────────────────
    async function loadHoldings() {
      try {
        var holdings = await API.getHoldings();
        var select = document.getElementById('stockSelect');
        var optionsHtml = '<option value="">General Question</option>';
        for (var i = 0; i < holdings.length; i++) {
          var sym = escapeHtml(holdings[i].tradingSymbol);
          optionsHtml += '<option value="' + sym + '">' + sym + '</option>';
        }
        select.innerHTML = optionsHtml;

        // Pre-select from URL param
        var params = new URLSearchParams(window.location.search);
        var symbol = params.get('symbol');
        if (symbol) {
          select.value = symbol;
        }
      } catch (error) {
        console.error('Error loading holdings:', error);
      }
    }

    // ── Send message ─────────────────────────────────────
    async function sendMessage() {
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if (!text) return;

      var symbol = document.getElementById('stockSelect').value;

      // Hide empty state
      var emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.style.display = 'none';

      // Append user message
      appendMessage('user', text, false);

      // Clear input
      input.value = '';

      // Show loading indicator
      var loadingEl = document.createElement('div');
      loadingEl.className = 'chat-message assistant';
      loadingEl.id = 'loadingMsg';
      var loadingBubble = document.createElement('div');
      loadingBubble.className = 'chat-bubble';
      var dots = document.createElement('div');
      dots.className = 'loading-dots';
      dots.appendChild(document.createElement('span'));
      dots.appendChild(document.createElement('span'));
      dots.appendChild(document.createElement('span'));
      loadingBubble.appendChild(dots);
      loadingEl.appendChild(loadingBubble);
      document.getElementById('chatContainer').appendChild(loadingEl);
      scrollToBottom();

      try {
        var response = await API.customAnalysis({
          symbol: symbol || null,
          prompt: text,
          agentType: selectedAgent || 'GENERAL',
          conversationHistory: conversationHistory
        });

        // Remove loading
        var lm = document.getElementById('loadingMsg');
        if (lm) lm.remove();

        // Build assistant content
        var answerHtml = '';
        if (response.answer) {
          answerHtml = formatMarkdown(response.answer);
        }
        if (response.confidence !== undefined && response.confidence !== null) {
          answerHtml += '<div class="confidence-badge" style="margin-top:0.5rem;font-size:0.8rem;opacity:0.7;">Confidence: ' + Math.round(response.confidence * 100) + '%</div>';
        }
        if (response.sources && response.sources.length > 0) {
          answerHtml += '<div class="response-sources" style="margin-top:0.5rem;font-size:0.8rem;opacity:0.7;"><strong>Sources:</strong> ' + escapeHtml(response.sources.join(', ')) + '</div>';
        }

        appendMessage('assistant', answerHtml, true);

        // Update conversation history
        conversationHistory.push(
          { role: 'user', content: text },
          { role: 'assistant', content: response.answer || '' }
        );

      } catch (error) {
        var lm2 = document.getElementById('loadingMsg');
        if (lm2) lm2.remove();
        appendMessage('assistant', 'Error: ' + escapeHtml(error.message), true);
      }

      scrollToBottom();
    }

    function appendMessage(role, content, isHtml) {
      var container = document.getElementById('chatContainer');
      var div = document.createElement('div');
      div.className = 'chat-message ' + role;
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      if (isHtml) {
        bubble.innerHTML = content;
      } else {
        bubble.textContent = content;
      }
      div.appendChild(bubble);
      container.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      var container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>');
    }

    // ── Clear chat ───────────────────────────────────────
    function clearChat() {
      var container = document.getElementById('chatContainer');
      // Remove all children
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }
      // Recreate empty state
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.id = 'emptyState';
      var icon = document.createElement('span');
      icon.className = 'empty-icon';
      icon.textContent = '◈';
      var p = document.createElement('p');
      p.className = 'empty-text';
      p.textContent = 'Select an agent and ask a question about any stock or market topic';
      empty.appendChild(icon);
      empty.appendChild(p);
      container.appendChild(empty);
      conversationHistory = [];
    }

    // ── Enter to send, Shift+Enter for newline ───────────
    document.getElementById('chatInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ── Init ─────────────────────────────────────────────
    (async function init() {
      await checkAuth();
      await loadAgents();
      await loadHoldings();
    })();
  </script>
</body>
</html>
