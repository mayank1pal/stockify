    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

                    <path d="M10 25 L15 17 L20 21 L25 14 L30 19" stroke="white" stroke-width="2" stroke-linecap="round"
                        fill="none" />
                </svg>
                <h1>StockMan</h1>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" />
                            <rect x="14" y="3" width="7" height="7" />

                            <rect x="3" y="14" width="7" height="7" />

                        Dashboard

                </li>

                    <a href="holdings.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                        </svg>
                        Holdings
                    </a>
                </li>
                <li class="nav-item">
                    <a href="analysis.html" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
                            <path d="M22 12A10 10 0 0 0 12 2v10z" />
                        </svg>
                        AI Analysis
                    </a>
                </li>
                <li class="nav-item">
                    <a href="copilot.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2a3 3 0 0 0-3 3v1H6a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1v3a7 7 0 0 0 14 0v-3h1a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3V5a3 3 0 0 0-3-3z" />
                            <circle cx="9" cy="13" r="1" />
                            <circle cx="15" cy="13" r="1" />
                        </svg>
                        Copilot
                    </a>
                </li>
                <li class="nav-item">
                    <a href="strategy.html" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20V10" />
                            <path d="M18 20V4" />
                            <path d="M6 20v-4" />

                        Strategy
                    </a>

            <div style="margin-top: auto; padding-top: var(--space-lg); border-top: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md);">
                    <div
                        style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center;">
                        <span class="user-avatar-text" style="font-weight: 700; color: white;">D</span>
                    </div>
                    <div>
                        <div class="user-name" style="font-weight: 600; font-size: 0.875rem;">Demo User</div>
                        <div style="color: var(--text-muted); font-size: 0.75rem;">demo@stockman.app</div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="API.logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>AI Stock Analysis</h1>
                    <p class="text-muted">Ask AI agents about your portfolio stocks</p>
                </div>
            </div>

            <!-- Agent Selector -->
            <div class="card" id="agentSelector">
                <h2>Select AI Agent</h2>
                <div class="agent-grid" id="agentGrid">
                    <!-- Agents will be loaded here -->
                </div>
            </div>

            <!-- Stock Selector & Analysis Interface -->
            <div class="card">
                <div class="analysis-controls">
                    <div class="form-group">
                        <label>Stock (Optional)</label>
                        <select id="stockSelect" class="form-control">
                            <option value="">General Question (No specific stock)</option>
                        </select>
                    </div>
                </div>

                <!-- Conversation History -->
                <div class="conversation-container" id="conversationContainer">
                    <div class="conversation-empty" id="emptyState">
                        <div class="empty-icon">💬</div>
                        <h3>Start a Conversation</h3>
                        <p>Select an AI agent above and ask your question below</p>
                    </div>
                    <div class="conversation-messages" id="messages"></div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea id="promptInput" class="prompt-input"
                            placeholder="Ask your question... (e.g., 'Should I buy this stock?', 'What are the key risks?')"
                            rows="3"></textarea>
                        <div class="input-actions">
                            <button class="btn btn-sm btn-outline" onclick="clearConversation()">Clear</button>
                            <button class="btn btn-sm btn-primary" onclick="sendQuestion()" id="sendBtn">
                                <span>Send</span>
                                <span class="btn-icon">→</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Suggested Questions -->
                <div class="suggested-questions" id="suggestedQuestions" style="display: none;">
                    <div class="suggested-label">Suggested questions:</div>
                    <div class="question-chips" id="questionChips"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="scripts/api.js"></script>
    <script>
        let selectedAgent = null;
        let conversationHistory = [];
        let agents = [];
        let holdings = [];

        // Load on page init
        async function init() {
            await API.getAuthStatus();
            await loadAgents();
            await loadHoldings();
        }

        async function loadAgents() {
            try {
                agents = await API.getAgents();
                renderAgents(agents);

                // Select General agent by default
                const generalAgent = agents.find(a => a.type === 'GENERAL');
                if (generalAgent) {
                    selectAgent(generalAgent);
                }
            } catch (error) {
                console.error('Error loading agents:', error);
            }
        }

        function renderAgents(agents) {
            const grid = document.getElementById('agentGrid');
            grid.innerHTML = agents.map(agent => `
                <div class="agent-card ${selectedAgent?.type === agent.type ? 'selected' : ''}" 
                     onclick="selectAgent(${JSON.stringify(agent).replace(/"/g, '&quot;')})">
                    <div class="agent-icon">${agent.icon}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-description">${agent.description}</div>
                        <div class="agent-focus">
                            ${agent.focusAreas.slice(0, 2).map(area => `<span class="focus-tag">${area}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectAgent(agent) {
            selectedAgent = agent;
            renderAgents(agents);
            updateSuggestedQuestions();
        }

        function updateSuggestedQuestions() {
            if (!selectedAgent) return;

            const container = document.getElementById('suggestedQuestions');
            const chips = document.getElementById('questionChips');

            // Get suggested questions based on agent type
            const suggestions = {
                'FUNDAMENTAL': [
                    'What are the key financial metrics I should focus on?',
                    'How does the valuation compare to peers?',
                    'What are the main competitive advantages?'
                ],
                'TECHNICAL': [
                    'What are the key support and resistance levels?',
                    "What's the current trend and momentum?",
                    'What would be good entry and exit points?'
                ],
                'QUANTITATIVE': [
                    "What is the stock's volatility profile?",
                    'How does it correlate with the broader market?',
                    'What are the risk-adjusted returns?'
                ],
                'SENTIMENT': [
                    "What's the current market sentiment?",
                    'How is analyst coverage trending?',
                    "What's the social media sentiment?"
                ],
                'GENERAL': [
                    'Should I buy, hold, or sell this stock?',
                    'What are the main risks and opportunities?',
                    "What's the potential upside and downside?"
                ]
            };

            const agentSuggestions = suggestions[selectedAgent.type] || suggestions['GENERAL'];
            chips.innerHTML = agentSuggestions.map(q => `
                <button class="question-chip" onclick="askSuggested('${q.replace(/'/g, "\\'")}')">${q}</button>
            `).join('');

            container.style.display = conversationHistory.length === 0 ? 'block' : 'none';
        }

        async function loadHoldings() {
            try {
                holdings = await API.getHoldings();
                const select = document.getElementById('stockSelect');
                select.innerHTML = '<option value="">General Question (No specific stock)</option>' +
                    holdings.map(h => `<option value="${h.tradingSymbol}">${h.tradingSymbol}</option>`).join('');
            } catch (error) {
                console.error('Error loading holdings:', error);
            }
        }

        function askSuggested(question) {
            document.getElementById('promptInput').value = question;
            sendQuestion();
        }

        async function sendQuestion() {
            if (!selectedAgent) {
                alert('Please select an AI agent first');
                return;
            }

            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            const symbol = document.getElementById('stockSelect').value;

            // Hide empty state
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('suggestedQuestions').style.display = 'none';

            // Add user message
            addMessage('user', prompt);
            document.getElementById('promptInput').value = '';

            // Show loading
            const loadingId = addMessage('assistant', '<div class="loading-dots"><span></span><span></span><span></span></div>', true);

            try {
                const response = await API.customAnalysis({
                    symbol: symbol || null,
                    prompt: prompt,
                    agentType: selectedAgent.type,
                    conversationHistory: conversationHistory
                });

                // Remove loading message
                removeMessage(loadingId);

                // Add AI response
                addMessage('assistant', formatResponse(response));

                // Update conversation history
                conversationHistory.push(
                    { role: 'user', content: prompt, timestamp: Date.now() },
                    { role: 'assistant', content: response.answer, timestamp: response.timestamp }
                );

            } catch (error) {
                removeMessage(loadingId);
                addMessage('assistant', '❌ Error: ' + error.message);
            }
        }

        function formatResponse(response) {
            return `
                <div class="ai-response">
                    <div class="response-header">
                        <span class="agent-badge">${selectedAgent.icon} ${selectedAgent.name}</span>
                        <span class="confidence-badge">Confidence: ${Math.round(response.confidence * 100)}%</span>
                    </div>
                    <div class="response-content">${formatMarkdown(response.answer)}</div>
                    ${response.sources && response.sources.length > 0 ? `
                        <div class="response-sources">
                            <strong>Sources:</strong> ${response.sources.join(', ')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function formatMarkdown(text) {
            // Simple markdown formatting
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        let messageId = 0;
        function addMessage(role, content, isLoading = false) {
            const id = `msg-${messageId++}`;
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}-message ${isLoading ? 'loading' : ''}`;
            messageEl.id = id;
            messageEl.innerHTML = `
                <div class="message-content">${content}</div>
            `;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function clearConversation() {
            if (!confirm('Clear conversation history?')) return;
            conversationHistory = [];
            document.getElementById('messages').innerHTML = '';
            document.getElementById('emptyState').style.display = 'flex';
            updateSuggestedQuestions();
        }

        // Handle Enter key in textarea (Shift+Enter for new line)
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });

        init();
    </script>
</body>

</html>
