<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMan — Login</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">S</span>
        <h1>StockMan</h1>
      </div>
      <p class="login-subtitle">AI-Powered Investment Intelligence</p>

      <div class="login-actions">
        <button class="btn btn-primary btn-lg" id="loginBtn" onclick="loginWithZerodha()">Connect with Zerodha</button>
        <div class="login-divider">or</div>
        <button class="btn btn-secondary btn-lg" id="demoBtn" onclick="startDemo()">Try Demo Mode</button>
      </div>

      <p class="text-muted" style="margin-top: 32px; font-size: 0.82rem;">Built with AI agents for smarter investing</p>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script>
    // Check if already authenticated - redirect to dashboard
    async function checkAuth() {
      try {
        const status = await API.getAuthStatus();
        if (status.authenticated) {
          window.location.href = '/dashboard.html';
        }
      } catch (e) {
        // Not authenticated, stay on login
      }
    }

    async function loginWithZerodha() {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      try {
        const response = await API.login();
        if (response.loginUrl) {
          window.location.href = response.loginUrl;
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Connect with Zerodha';
        alert('Failed to connect. Please try again.');
      }
    }

    async function startDemo() {
      const btn = document.getElementById('demoBtn');
      btn.disabled = true;
      btn.textContent = 'Starting...';
      try {
        await API.enableDemoMode();
        window.location.href = '/dashboard.html';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Try Demo Mode';
        alert('Failed to start demo. Please try again.');
      }
    }

    checkAuth();
  </script>
</body>
</html>
