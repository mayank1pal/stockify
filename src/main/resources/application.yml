server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: StockMan

# Zerodha Kite Connect Configuration
zerodha:
  api-key: ${ZERODHA_API_KEY:your-api-key-placeholder}
  api-secret: ${ZERODHA_API_SECRET:your-api-secret-placeholder}
  redirect-url: http://localhost:8080/api/auth/callback
  login-url: https://kite.zerodha.com/connect/login

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:your-gemini-api-key-placeholder}
  model: gemini-pro
  base-url: https://generativelanguage.googleapis.com/v1beta

# CORS Configuration
app:
  cors:
    allowed-origins: http://localhost:8080,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

# Logging
logging:
  level:
    com.stockman: DEBUG
    org.springframework.web: INFO
