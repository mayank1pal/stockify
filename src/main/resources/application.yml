server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: StockMan

# Zerodha Kite Connect Configuration
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8080/api/auth/callback}
  login-url: https://kite.zerodha.com/connect/login

# OpenRouter Configuration (unified LLM gateway)
openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  default-model: google/gemini-2.5-flash
  fallback-model: google/gemini-2.5-flash
  max-tokens: 8192
  models:
    fundamental: google/gemini-2.5-flash
    technical: google/gemini-2.5-flash
    quantitative: qwen/qwen3-235b-a22b-2507
    sentiment: google/gemini-2.5-flash
    general: google/gemini-2.5-flash
    risk-assessor: qwen/qwq-32b
    portfolio-optimizer: google/gemini-2.5-flash
    geopolitical: qwen/qwen3-235b-a22b-2507
    trade-executor: qwen/qwq-32b
    synthesizer: qwen/qwen3-235b-a22b-2507

# Finnhub News Configuration
finnhub:
  api-key: ${FINNHUB_API_KEY}
  base-url: https://finnhub.io/api/v1

# Copilot Configuration
copilot:
  agent-timeout-seconds: 30
  max-concurrent-agents: 6
  cache-ttl-minutes: 15

# CORS Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

# Scanner Configuration
scanner:
  enabled: true
  connect-time: "09:00"
  disconnect-time: "15:35"
  silence-period-end: "09:16:30"
  warmup-minutes: 30
  holiday-calendar: classpath:holidays.json
  candle-window-size: 600
  tick-queue-capacity: 10000
  reconnect:
    initial-delay-seconds: 5
    max-delay-seconds: 60
    multiplier: 2.0
  cooldown:
    scalp-minutes: 5
    intraday-minutes: 15
    swing-minutes: 60
  ai-enrichment:
    enabled: true
    max-calls-per-minute: 10
    timeout-seconds: 15
    swing-gate-timeout-seconds: 15

# Alerts Configuration
alerts:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  discord:
    enabled: false
    bot-token: ${DISCORD_BOT_TOKEN:}
    channel-ids:
      scalp: ${DISCORD_SCALP_CHANNEL:}
      intraday: ${DISCORD_INTRADAY_CHANNEL:}
      swing: ${DISCORD_SWING_CHANNEL:}
  websocket:
    enabled: true

# Admin Configuration
admin:
  # Admin credential for /api/admin/* endpoints (via ADMIN_API_KEY env var)
  credential: ${ADMIN_API_KEY}

# Logging
logging:
  level:
    com.stockman: DEBUG
    org.springframework.web: INFO

scanner:
  enabled: true
  connect-time: "09:00"
  disconnect-time: "15:35"
  silence-period-end: "09:16:30"
  warmup-minutes: 30
  holiday-calendar: classpath:holidays.json
  candle-window-size: 600
  tick-queue-capacity: 10000
  reconnect:
    initial-delay-seconds: 5
    max-delay-seconds: 60
    multiplier: 2.0
  cooldown:
    scalp-minutes: 5
    intraday-minutes: 15
    swing-minutes: 60
  ai-enrichment:
    enabled: true
    max-calls-per-minute: 10
    timeout-seconds: 15
    swing-gate-timeout-seconds: 15

alerts:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  discord:
    enabled: false
    bot-token: ${DISCORD_BOT_TOKEN:}
    channel-ids:
      scalp: ${DISCORD_SCALP_CHANNEL:}
      intraday: ${DISCORD_INTRADAY_CHANNEL:}
      swing: ${DISCORD_SWING_CHANNEL:}
  websocket:
    enabled: true

admin:
  credential: ${ADMIN_API_KEY:changeme}
